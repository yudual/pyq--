name: Build Check

# 仅做构建验证：发布由甲骨文 or4 构建机流程完成（scripts 流程见仓库文档）
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          # 根目录 lockfile 被 .gitignore 忽略，缓存依赖需指向已跟踪的子目录 lockfile
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # 1. 编译后端
      - name: Build Backend
        run: |
          cd backend
          pnpm install
          pnpm build

      # 2. 编译前端（生产 Standalone 独立产物）
      - name: Build Frontend
        run: |
          cd frontend
          pnpm install
          pnpm build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
